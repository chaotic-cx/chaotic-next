name: Deploy
on:
  push:
    branches: ["main"]
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  checks:
    name: Lint, format, test and build
    uses: ./.github/workflows/checks.yml
  build-and-push:
    name: Build and push Docker image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A version tag (e.g. 1.0.0) becomes that tag, and the newest one is
            # additionally published as `latest`.
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          else
            # The main branch is deployed under the `main` tag.
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
