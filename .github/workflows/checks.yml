name: Checks
on:
  workflow_call:
jobs:
  unit:
    name: Lint, format, test, build and unit coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm exec prettier --check .
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Full backend tests
        run: pnpm exec nx run backend:test:full --skip-nx-cache
      - name: Unit coverage
        run: pnpm exec nx run backend:test-ci --skip-nx-cache
      - name: Build
        run: pnpm build
      - name: Upload unit coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage-backend
          path: coverage/backend/
          if-no-files-found: ignore
  e2e:
    name: End-to-end tests (with coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run e2e tests with coverage
        run: pnpm exec nx run backend-e2e:test-ci --skip-nx-cache
      - name: Upload e2e coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage-backend-e2e
          path: coverage/backend-e2e/
          if-no-files-found: ignore
  coverage-report:
    name: Combine and report coverage
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download unit coverage
        uses: actions/download-artifact@v5
        with:
          name: coverage-backend
          path: coverage/backend/
      - name: Download e2e coverage
        uses: actions/download-artifact@v5
        with:
          name: coverage-backend-e2e
          path: coverage/backend-e2e/
      - name: Merge unit + e2e coverage
        run: node tools/merge-coverage.mjs coverage/combined/coverage-final.json coverage/backend/coverage-final.json coverage/backend-e2e/coverage-final.json
      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/combined/coverage-summary.json
          json-final-path: coverage/combined/coverage-final.json
          file-coverage-mode: all
