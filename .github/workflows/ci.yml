name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    name: Lint, format, typecheck and knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup repository
        uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Check for unused files and dependencies
        run: pnpm knip
  unit:
    name: Unit tests and build
    needs: [static-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup repository
        uses: ./.github/actions/setup
        with:
          install-system-deps: 'true'
      - name: Cache fixtures
        uses: actions/cache@v6
        with:
          path: backend/src/repo-manager/__fixtures__/*.pkg.tar.zst
          key: fixtures-${{ hashFiles('backend/src/repo-manager/__fixtures__/packages.json') }}
      - name: Fetch fixtures
        run: node tools/fetch-fixtures.mjs
      - name: Unit tests with coverage
        run: pnpm exec nx run-many --target=test-ci --exclude=backend-e2e --all --skip-nx-cache
      - name: Build
        run: pnpm build
      - name: Upload unit coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage/backend/
          if-no-files-found: ignore
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup repository
        uses: ./.github/actions/setup
        with:
          install-system-deps: 'true'
      - name: Run e2e tests with coverage
        run: pnpm exec nx run backend-e2e:test-ci --skip-nx-cache
      - name: Upload e2e coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend-e2e
          path: coverage/backend-e2e/
          if-no-files-found: ignore
  coverage-report:
    name: Combine and report coverage
    if: github.event_name == 'pull_request' && !cancelled() && needs.unit.result == 'success' && needs.e2e.result == 'success'
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download unit coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: coverage/backend/
      - name: Download e2e coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-backend-e2e
          path: coverage/backend-e2e/
      - name: Merge unit + e2e coverage
        run: node tools/merge-coverage.mjs coverage/combined/coverage-final.json coverage/backend/coverage-final.json coverage/backend-e2e/coverage-final.json
      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/combined/coverage-summary.json
          json-final-path: coverage/combined/coverage-final.json
          file-coverage-mode: all
