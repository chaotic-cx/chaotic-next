<!doctype html>
<html class="dark-mode mocha" lang="en" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta content="Chaotic-AUR - automated binary repo 👨🏻‍💻" property="og:title" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <meta content="#cba6f7" name="theme-color" />
    <script>
      // Applies the stored or system theme before Angular boots, so the page never flashes the wrong flavour.
      // ThemeService (app/theme-switcher) owns the theme after boot. Keep the storage key and colours in sync.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('theme') || 'system';
        } catch (error) {
          // Storage is not available.
        }

        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = preference === 'dark' || (preference !== 'light' && prefersDark);
        if (isDark) {
          return;
        }

        var root = document.documentElement;
        root.classList.remove('dark-mode', 'mocha');
        root.classList.add('latte');
        root.style.colorScheme = 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#8839ef');
      })();
    </script>

    <title>Chaotic-AUR</title>
    <base href="/" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" href="/sitemap-index.xml" />
    <link href="https://builds.garudalinux.org" rel="preconnect" />
    <link href="https://backend.chaotic.cx" rel="preconnect" crossorigin />
    <link href="https://status.chaotic.cx" rel="preconnect" crossorigin />
    <link href="/i18n/en.json" rel="preload" as="fetch" crossorigin />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <meta content="Chaotic-AUR" name="apple-mobile-web-app-title" />
  </head>
  <body>
    <chaotic-root></chaotic-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
