<!doctype html>
<html class="dark-mode mocha" lang="en" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <meta content="#cba6f7" name="theme-color" />
    <script>
      // Applies the stored or system theme before Angular boots, so the page never flashes the wrong flavour.
      // ThemeService (app/theme-switcher) owns the theme after boot. Keep the storage key and colours in sync.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('theme') || 'system';
        } catch (error) {
          // Storage is not available.
        }

        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = preference === 'dark' || (preference !== 'light' && prefersDark);
        if (isDark) {
          return;
        }

        var root = document.documentElement;
        root.classList.remove('dark-mode', 'mocha');
        root.classList.add('latte');
        root.style.colorScheme = 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#8839ef');
      })();
    </script>
    <script>
      // Prerendered pages hold English text. For any other language, the page stays hidden until Angular shows the
      // translation, so visitors never see the English text switch. revealTranslatedPage (app/i18n) removes the style.
      // The rule is created here, not in styles.css: the critical CSS step drops rules that match nothing at build time.
      // Keep the storage key and the language list in sync with app/i18n/languages.ts.
      (function () {
        var PENDING_STYLE_ID = 'i18n-pending';
        var DEFAULT_LANGUAGE = 'en';
        var AVAILABLE_LANGUAGES = [DEFAULT_LANGUAGE, 'de'];
        // If the app fails to start, show the English page rather than a blank one.
        var REVEAL_FALLBACK_MS = 3000;

        var stored = null;
        try {
          stored = localStorage.getItem('language');
        } catch (error) {
          // Storage is not available.
        }

        var browser = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        var candidates = [stored, browser.split(/[-_]/)[0]];
        var language = DEFAULT_LANGUAGE;
        for (var index = 0; index < candidates.length; index++) {
          if (AVAILABLE_LANGUAGES.indexOf(candidates[index]) !== -1) {
            language = candidates[index];
            break;
          }
        }

        if (language === DEFAULT_LANGUAGE) {
          return;
        }

        // Visibility keeps the layout, so nothing shifts on reveal.
        var style = document.createElement('style');
        style.id = PENDING_STYLE_ID;
        style.textContent = 'chaotic-root { visibility: hidden; }';
        document.head.appendChild(style);
        setTimeout(function () {
          style.remove();
        }, REVEAL_FALLBACK_MS);
      })();
    </script>

    <title>Chaotic-AUR</title>
    <base href="/" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" href="/sitemap-index.xml" />
    <link href="https://builds.garudalinux.org" rel="preconnect" />
    <link href="https://backend.chaotic.cx" rel="preconnect" crossorigin />
    <link href="https://status.chaotic.cx" rel="preconnect" crossorigin />
    <link href="/i18n/en.json" rel="preload" as="fetch" crossorigin />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <meta content="Chaotic-AUR" name="apple-mobile-web-app-title" />
  </head>
  <body>
    <chaotic-root></chaotic-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
