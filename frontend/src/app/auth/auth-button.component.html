@if (isLoggedIn()) {
  <div class="ml-3 flex flex-nowrap items-center gap-2">
    <span class="auth-actions flex items-center gap-2">
      <a
        class="my-auto text-lg leading-none text-ctp-maroon"
        routerLink="/admin"
        aria-label="Admin"
        pTooltip="Manage packages and repositories"
        tooltipPosition="left"
      >
        <i class="pi pi-shield"></i>
      </a>
      <p-button
        [loading]="isLogoutLoading()"
        (onClick)="logout()"
        icon="pi pi-sign-out"
        severity="secondary"
        text
        rounded
        pTooltip="Sign out"
        tooltipPosition="left"
      />
    </span>
    <span class="auth-avatar">
      @if (user(); as user) {
        @if (user.image) {
          <a
            class="inline-flex items-center"
            [href]="gitlabProfileUrl()"
            target="_blank"
            rel="noopener noreferrer"
            pTooltip="View GitLab profile"
            tooltipPosition="left"
          >
            <p-avatar
              [image]="avatarUrl()"
              [label]="avatarUrl() ? undefined : avatarLabel()"
              (onImageError)="onAvatarError()"
              shape="circle"
              pTooltip="View GitLab profile"
              tooltipPosition="left"
            />
          </a>
        }
      }
    </span>
  </div>
} @else {
  <span class="auth-actions">
    <p-button
      [loading]="isLoginLoading()"
      (onClick)="login()"
      icon="pi pi-sign-in"
      severity="secondary"
      styleClass="ml-3"
      pTooltip="Sign in with GitLab"
      tooltipPosition="left"
      text
      rounded
    />
  </span>
}
