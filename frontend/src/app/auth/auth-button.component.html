<ng-container *transloco="let t; prefix: 'auth.button'">
  @if (isLoggedIn()) {
    <div class="chaotic-bar-actions">
      <span class="auth-actions chaotic-bar-actions">
        <a
          class="chaotic-bar-action text-ctp-maroon"
          [attr.aria-label]="t('adminLabel')"
          [pTooltip]="t('adminTooltip')"
          routerLink="/admin"
          tooltipPosition="left"
        >
          <i class="pi pi-shield" aria-hidden="true"></i>
        </a>
        <p-button
          [ariaLabel]="t('signOut')"
          [loading]="isLogoutLoading()"
          [pTooltip]="t('signOut')"
          (onClick)="logout()"
          icon="pi pi-sign-out"
          severity="secondary"
          size="small"
          text
          rounded
          tooltipPosition="left"
        />
      </span>
      <span class="auth-avatar">
        @if (user()) {
          <a
            class="inline-flex items-center"
            [attr.aria-label]="t('openSettings')"
            [pTooltip]="t('openSettings')"
            routerLink="/settings"
            tooltipPosition="left"
          >
            <p-avatar
              [image]="avatarUrl()"
              [label]="avatarUrl() ? undefined : avatarLabel()"
              (onImageError)="onAvatarError()"
              shape="circle"
            />
          </a>
        }
      </span>
    </div>
  } @else {
    <span class="auth-actions chaotic-bar-actions">
      <p-button
        [ariaLabel]="t('signIn')"
        [loading]="isLoginLoading()"
        [pTooltip]="t('signIn')"
        (onClick)="login()"
        icon="pi pi-sign-in"
        severity="secondary"
        size="small"
        tooltipPosition="left"
        text
        rounded
      />
    </span>
  }
</ng-container>
