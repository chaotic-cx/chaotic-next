@if (chartConfig().data.labels?.length || loading()) {
  <div class="card relative flex justify-center min-h-[10rem]" [style.height.px]="(amount() || 1) * 28 + 48">
    @if (hasData()) {
      <p-chart
        class="w-full h-full"
        [data]="chartConfig().data"
        [options]="chartConfig().options"
        [responsive]="true"
        type="bar"
      />
    }
    @if (loading()) {
      <div class="absolute inset-0 flex items-center justify-center">
        <i class="pi pi-spin pi-spinner text-ctp-flamingo" style="font-size: 3rem"></i>
      </div>
    }
  </div>
}
<p-input-number
  class="mt-2"
  [(ngModel)]="amount"
  [showButtons]="true"
  [min]="1"
  (ngModelChange)="setAmount($event)"
  mode="decimal"
  inputId="amount"
  placeholder="Number of packages"
/>
