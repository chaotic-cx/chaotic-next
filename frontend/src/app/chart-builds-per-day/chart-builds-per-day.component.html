<div class="card mb-10 flex justify-center">
  @if (loading()) {
    <div class="flex h-60 w-full items-center justify-center">
      <i class="pi pi-spin pi-spinner text-ctp-flamingo" style="font-size: 3rem"></i>
    </div>
  } @else {
    <p-chart
      class="w-full mx-20"
      [data]="chartConfig()!.data"
      [options]="chartConfig()!.options"
      [responsive]="true"
      type="line"
    />
  }
</div>
<p-input-number
  [(ngModel)]="days"
  [showButtons]="true"
  [min]="1"
  [max]="365"
  (ngModelChange)="onDaysChange()"
  mode="decimal"
  inputId="days"
  placeholder="Number of days"
/>
