<div class="chaotic-page">
  <chaotic-title [subtitle]="subtitle" title="AUR scan" />

  <section class="chaotic-card" aria-labelledby="aur-scan-card-title">
    <header class="chaotic-card__header">
      <h2 class="chaotic-card__title" id="aur-scan-card-title">Scan a package</h2>
      @if (metrics(); as m) {
        <span class="aur-scan-count">{{ m.total | number }} scanned so far</span>
      }
    </header>
    <form class="aur-scan-form" (submit)="$event.preventDefault(); scanQuery()">
      <p-autoComplete
        class="aur-scan-form__input"
        [fluid]="true"
        [ngModel]="searchModel().query"
        [ngModelOptions]="{ standalone: true }"
        [suggestions]="suggestions()"
        [delay]="300"
        [minQueryLength]="3"
        (ngModelChange)="searchModel.update((m) => ({ ...m, query: $event ?? '' }))"
        (completeMethod)="searchSuggestions($event)"
        (onSelect)="selectPackage($event.value)"
        (onKeyUp)="onKeyUp($event)"
        ariaLabel="AUR package name"
        placeholder="AUR package name, e.g. firedragon"
        appendTo="body"
      />
    </form>

    @if (currentPackageName(); as name) {
      <div class="border-t border-(--chaotic-border) px-4 pt-5" animate.enter="ctp-fade-enter">
        <chaotic-aur-scan-result [packageName]="name" />
      </div>
    } @else {
      <p class="border-t border-(--chaotic-border) px-4 py-4 text-sm text-ctp-subtext0">
        The scan fetches the PKGBUILD and its sources, checks them against our static security rules and VirusTotal, and
        reports maintainer changes.
      </p>
    }
  </section>
</div>
