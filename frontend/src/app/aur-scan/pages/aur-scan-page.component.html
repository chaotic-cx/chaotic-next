<div class="chaotic-page" *transloco="let t; prefix: 'aurScan.page'">
  <chaotic-title [subtitle]="t('subtitle')" [title]="t('title')" />

  <section class="chaotic-card" aria-labelledby="aur-scan-card-title">
    <header class="chaotic-card__header">
      <h2 class="chaotic-card__title" id="aur-scan-card-title">{{ t('cardTitle') }}</h2>
      @if (metrics(); as m) {
        <span class="aur-scan-count">{{ t('scannedSoFar', { count: (m.total | number) }) }}</span>
      }
    </header>
    <form class="aur-scan-form" (submit)="$event.preventDefault(); scanQuery()">
      <p-autoComplete
        class="aur-scan-form__input"
        [fluid]="true"
        [ngModel]="searchModel().query"
        [ngModelOptions]="{ standalone: true }"
        [suggestions]="suggestions()"
        [delay]="300"
        [minQueryLength]="minQueryLength"
        [ariaLabel]="t('inputLabel')"
        [placeholder]="t('inputPlaceholder')"
        (ngModelChange)="searchModel.update((m) => ({ ...m, query: $event ?? '' }))"
        (completeMethod)="searchSuggestions($event)"
        (onSelect)="selectPackage($event.value)"
        (onKeyUp)="onKeyUp($event)"
        appendTo="body"
      />
    </form>

    @if (!currentPackageName()) {
      <p class="border-t border-(--chaotic-border) px-4 py-4 text-sm text-ctp-subtext0">
        {{ t('intro') }}
      </p>
    }
  </section>

  @if (currentPackageName(); as name) {
    <chaotic-aur-scan-result
      class="aur-scan-result"
      [packageName]="name"
      animate.enter="ctp-fade-enter"
      layout="split"
    />
  }
</div>
