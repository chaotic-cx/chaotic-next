<ng-container *transloco="let t; prefix: 'stats.charts'">
  <chaotic-chart-card
    [data]="chartConfig().data"
    [options]="chartConfig().options"
    [hasData]="chart.hasData()"
    [loading]="chart.loading()"
    [failed]="chart.failed()"
    [height]="chartRowHeight(amount(), isMobile())"
    (retry)="chart.retry()"
    type="bar"
    containerClass="card relative flex justify-center min-h-[10rem] max-h-[60rem]"
  />
  <p-input-number
    class="mt-4"
    [(ngModel)]="amount"
    [showButtons]="true"
    [min]="1"
    [placeholder]="t('numberOfPackages')"
    (ngModelChange)="setAmount($event)"
    mode="decimal"
    inputId="amount"
  />
</ng-container>
