@if (chartConfig().data.labels?.length || chart.loading()) {
  <chaotic-chart-card
    [data]="chartConfig().data"
    [options]="chartConfig().options"
    [hasData]="hasData()"
    [loading]="chart.loading()"
    [height]="chartRowHeight(amount(), isMobile())"
    type="bar"
    containerClass="card relative flex justify-center min-h-[10rem]"
  />
}
<p-input-number
  class="mt-4"
  [(ngModel)]="amount"
  [showButtons]="true"
  [min]="1"
  (ngModelChange)="setAmount($event)"
  mode="decimal"
  inputId="amount"
  placeholder="Number of packages"
/>
