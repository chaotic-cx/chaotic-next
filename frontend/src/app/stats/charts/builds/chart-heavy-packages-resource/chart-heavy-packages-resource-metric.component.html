<div class="flex flex-col gap-2">
  <span class="text-sm font-semibold text-ctp-subtext1">{{ metricDef().label }}</span>
  <div class="card relative flex justify-center min-h-[10rem]" [style.height.px]="(amount() || 1) * 28 + 48">
    @if (hasData()) {
      <p-chart
        class="w-full h-full"
        [data]="chartConfig().data"
        [options]="chartConfig().options"
        [responsive]="true"
        type="bar"
      />
    } @else if (loading()) {
      <div class="absolute inset-0 flex items-center justify-center">
        <i class="pi pi-spin pi-spinner text-ctp-flamingo" style="font-size: 3rem"></i>
      </div>
    } @else {
      <div class="absolute inset-0 flex items-center justify-center text-ctp-overlay1 text-sm">No data</div>
    }
  </div>
</div>
