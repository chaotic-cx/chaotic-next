@if (chart.loading()) {
  <div class="card relative flex h-[16rem] sm:h-[12rem] justify-center">
    <div class="absolute inset-0 flex items-center justify-center">
      <i class="pi pi-spin pi-spinner text-ctp-flamingo" style="font-size: 3rem"></i>
    </div>
  </div>
}
<div class="flex flex-col gap-6">
  @for (entry of charts(); track entry.key) {
    <chaotic-chart-card
      [data]="entry.config.data"
      [options]="entry.config.options"
      [hasData]="true"
      [loading]="false"
      type="line"
      containerClass="card relative flex h-[16rem] sm:h-[12rem] justify-center"
    />
  }
</div>
