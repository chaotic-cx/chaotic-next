<div class="chaotic-page" *transloco="let t">
  <chaotic-title [subtitleHtml]="t('stats.subtitle')" [title]="t('stats.title')" />

  <div class="stats-tabs-container">
    <p-tabs [value]="activeTab() ?? undefined" [scrollable]="true" (valueChange)="navigate($event)">
      <p-tablist>
        @for (tab of tabs; track tab.value) {
          <p-tab [value]="tab.value" [pTooltip]="t(tab.tooltipKey)" [showDelay]="400" tooltipPosition="bottom">{{
            t(tab.labelKey)
          }}</p-tab>
        }
      </p-tablist>
    </p-tabs>
    <div class="p-tabpanels flex flex-col">
      <div class="stats-toolbar">
        <span class="stats-toolbar__users">
          <span class="text-ctp-subtext0">{{ t('stats.toolbar.totalUsers') }}</span>
          @if (statsService.usersLoading() || statsService.totalUsers() === null) {
            <span class="font-semibold text-ctp-text"><chaotic-unknown-value /></span>
          } @else {
            <span class="font-semibold tabular-nums text-ctp-text" [title]="statsService.totalUsers() | number">
              {{ statsService.totalUsers() | compactNumber }}
            </span>
          }
        </span>
        <div class="stats-toolbar__filters">
          @if (activeTab() === 'search') {
            <p-select
              [(ngModel)]="statsService.packageSearchSelectedRepo"
              [options]="searchRepoOptions"
              [ariaLabel]="t('stats.toolbar.searchRepository')"
              (ngModelChange)="onRepoChange($event)"
              appendTo="body"
            />
          }
          @if (repoFilterVisible()) {
            <p-select
              [(ngModel)]="statsService.selectedRepo"
              [options]="repoOptions()"
              [ariaLabel]="t('stats.toolbar.repository')"
              [placeholder]="t('stats.toolbar.repository')"
              (ngModelChange)="onRepoChange($event)"
              appendTo="body"
              optionLabel="label"
              optionValue="value"
            />
          }
          <label class="sr-only" for="statsTimeRange">{{ t('stats.toolbar.timeRange') }}</label>
          <p-select
            [(ngModel)]="statsService.timeRangeDays"
            [options]="timeRangeOptions()"
            (ngModelChange)="onTimeRangeChange($event)"
            inputId="statsTimeRange"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
          />
        </div>
      </div>
      <router-outlet />
    </div>
  </div>
</div>
