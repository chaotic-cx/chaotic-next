<div class="chaotic-container-wide-center md:chaotic-container-regular px-0.5 sm:px-2.5">
  <chaotic-title [subtitleHtml]="subtitle" title="Statistics and data" />

  <div class="stats-tabs-container">
    <p-tabs [value]="activeTab() ?? undefined" (valueChange)="navigate($event)">
      <p-tablist>
        <p-tab pTooltip="Search for package statistics" tooltipPosition="bottom" value="search">Search</p-tab>
        <p-tab pTooltip="Global usage statistics" tooltipPosition="bottom" value="globals">Globals</p-tab>
        <p-tab pTooltip="Download statistics and trends" tooltipPosition="bottom" value="downloads">Downloads</p-tab>
        <p-tab pTooltip="Update review statistics" tooltipPosition="bottom" value="update-review">
          Update Reviews
        </p-tab>
        <p-tab pTooltip="Builder performance statistics" tooltipPosition="bottom" value="builder-stats">
          Builder Stats
        </p-tab>
        <p-tab pTooltip="Heaviest packages by container resource usage" tooltipPosition="bottom" value="resource-usage">
          Resource Usage
        </p-tab>
        <p-tab pTooltip="Packages added to the repository over time" tooltipPosition="bottom" value="additions">
          Additions
        </p-tab>
        <p-tab pTooltip="Build and usage insights" tooltipPosition="bottom" value="insights"> Insights </p-tab>
      </p-tablist>
    </p-tabs>
    <div class="p-tabpanels flex flex-col">
      <div class="mb-4 grid grid-cols-[auto_1fr] items-center gap-x-2 gap-y-2 sm:flex sm:items-center">
        <span class="text-sm text-ctp-subtext1 justify-self-start ml-2.5">
          Total users: {{ statsService.usersLoading() ? 'loading…' : (statsService.totalUsers() ?? '–') }}
        </span>
        <div class="flex items-center justify-self-end gap-2 sm:ml-auto">
          <label class="text-sm text-ctp-subtext1" for="statsTimeRange">Time range</label>
          <p-select
            [(ngModel)]="statsService.timeRangeDays"
            [options]="statsService.timeRangeOptions"
            (ngModelChange)="onTimeRangeChange($event)"
            inputId="statsTimeRange"
            optionLabel="label"
            optionValue="days"
            appendTo="body"
          />
        </div>
        @if (repoFilterVisible()) {
          <p-select
            class="col-span-2 w-full sm:col-span-1 sm:w-auto"
            [(ngModel)]="statsService.selectedRepo"
            [options]="statsService.repoOptions"
            (ngModelChange)="onRepoChange($event)"
            appendTo="body"
            optionLabel="label"
            optionValue="value"
            placeholder="Repo"
          />
        }
      </div>
      <router-outlet />
    </div>
  </div>
</div>
