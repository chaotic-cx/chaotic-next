<div class="chaotic-page">
  <chaotic-title [subtitleHtml]="subtitle" title="Statistics" />

  <div class="stats-tabs-container">
    <p-tabs [value]="activeTab() ?? undefined" [scrollable]="true" (valueChange)="navigate($event)">
      <p-tablist>
        @for (tab of tabs; track tab.value) {
          <p-tab [value]="tab.value" [pTooltip]="tab.tooltip" [showDelay]="400" tooltipPosition="bottom">{{
            tab.label
          }}</p-tab>
        }
      </p-tablist>
    </p-tabs>
    <div class="p-tabpanels flex flex-col">
      <div class="stats-toolbar">
        <span class="stats-toolbar__users">
          <span class="text-ctp-subtext0">Total users</span>
          <span class="font-semibold tabular-nums text-ctp-text">{{
            statsService.usersLoading() ? '–' : ((statsService.totalUsers() | number) ?? '–')
          }}</span>
        </span>
        <div class="stats-toolbar__filters">
          @if (activeTab() === 'search') {
            <p-select
              [(ngModel)]="statsService.packageSearchSelectedRepo"
              [options]="searchRepoOptions"
              (ngModelChange)="onRepoChange($event)"
              ariaLabel="Repository to search"
              appendTo="body"
            />
          }
          @if (repoFilterVisible()) {
            <p-select
              [(ngModel)]="statsService.selectedRepo"
              [options]="statsService.repoOptions"
              (ngModelChange)="onRepoChange($event)"
              ariaLabel="Repository"
              appendTo="body"
              optionLabel="label"
              optionValue="value"
              placeholder="Repository"
            />
          }
          <label class="sr-only" for="statsTimeRange">Time range</label>
          <p-select
            [(ngModel)]="statsService.timeRangeDays"
            [options]="statsService.timeRangeOptions"
            (ngModelChange)="onTimeRangeChange($event)"
            inputId="statsTimeRange"
            optionLabel="label"
            optionValue="days"
            appendTo="body"
          />
        </div>
      </div>
      <router-outlet />
    </div>
  </div>
</div>
