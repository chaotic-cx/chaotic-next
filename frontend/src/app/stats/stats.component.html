<div class="chaotic-container-wide-center flex min-h-svh flex-col">
  <chaotic-title [subtitleHtml]="subtitle()" title="Statistics and data" />

  <div class="flex flex-1 flex-col">
    <p-tabs [value]="activeTab()" (valueChange)="navigate($event)">
      <p-tablist>
        <p-tab pTooltip="Search for package statistics" tooltipPosition="bottom" value="search">Search</p-tab>
        <p-tab pTooltip="Global usage statistics" tooltipPosition="bottom" value="globals">Globals</p-tab>
        <p-tab pTooltip="Download statistics and trends" tooltipPosition="bottom" value="downloads">Downloads</p-tab>
        <p-tab pTooltip="Update review statistics" tooltipPosition="bottom" value="update-review">
          Update Reviews
        </p-tab>
        <p-tab pTooltip="Builder performance statistics" tooltipPosition="bottom" value="builder-stats">
          Builder Stats
        </p-tab>
      </p-tablist>
    </p-tabs>
    <div class="p-tabpanels flex flex-1 flex-col">
      <div class="mb-4 flex items-center justify-end gap-2">
        <label class="text-sm text-ctp-subtext1" for="statsTimeRange">Time range</label>
        <p-select
          [(ngModel)]="statsService.timeRangeDays"
          [options]="statsService.timeRangeOptions"
          inputId="statsTimeRange"
          optionLabel="label"
          optionValue="days"
          appendTo="body"
        />
      </div>
      <router-outlet />
    </div>
  </div>
</div>
