<div class="flex justify-center px-4 pt-36 pb-8" *transloco="let t; prefix: 'backendDown'">
  <div class="hero-card mx-auto w-full max-w-xl p-8 text-center">
    <img class="mx-auto rounded-xl" [alt]="t('logoAlt')" ngSrc="/assets/logo_400.png" width="64" height="64" priority />
    <h1 class="text-ctp-maroon mt-6 text-2xl font-bold">{{ t('title') }}</h1>
    <p class="text-ctp-subtext1 mt-3 text-sm">
      {{ t('message') }}
    </p>
    <p class="text-ctp-subtext0 mt-2 text-sm">
      {{ t('mirrorsHint') }}
      <a
        class="text-ctp-text underline underline-offset-4 hover:text-ctp-mauve focus-visible:text-ctp-mauve"
        routerLink="/mirrors"
        >{{ t('mirrorsLink') }}</a
      >
    </p>
    <span class="relative mt-4 inline-flex h-3 w-3">
      <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-ctp-mauve opacity-75"></span>
      <span class="relative inline-flex h-3 w-3 rounded-full bg-ctp-mauve"></span>
    </span>
  </div>
</div>
