<div class="chaotic-page" *transloco="let t; prefix: 'packageLog'">
  <chaotic-title [subtitle]="subtitle() ?? t('subtitle')" [title]="pkgname() || t('title')" />

  <div class="package-log">
    @if (streamFailed()) {
      <p class="log-error">{{ t('streamError') }}</p>
    }

    @if (builder() || streaming()) {
      <div class="log-toolbar">
        @if (builder(); as host) {
          <span class="builder-name">
            <i class="pi pi-server"></i>
            {{ host }}
          </span>
        }
        <div class="toolbar-right">
          @if (streaming()) {
            <span class="live-badge">{{ t('live') }}</span>
          }
          <button
            class="download-btn"
            [class.hide-download]="searchQuery()"
            [attr.aria-label]="t('downloadLog')"
            (click)="downloadLog()"
            type="button"
          >
            <i class="pi pi-download"></i>
          </button>
          @if (searchQuery()) {
            <button class="search-nav" [attr.aria-label]="t('previousMatch')" (click)="searchPrevious()" type="button">
              <i class="pi pi-angle-up"></i>
            </button>
            <button class="search-nav" [attr.aria-label]="t('nextMatch')" (click)="searchNext()" type="button">
              <i class="pi pi-angle-down"></i>
            </button>
          }
          <p-iconfield class="search-field" iconPosition="left">
            <p-inputicon>
              <i class="pi pi-search"></i>
            </p-inputicon>
            <input
              class="w-full"
              #searchInput
              [value]="searchQuery()"
              [placeholder]="t('searchBuffer')"
              (input)="onSearch($any($event.target).value)"
              (keydown.enter)="searchNext()"
              (keydown.shift.enter)="searchPrevious()"
              pInputText
              type="text"
            />
          </p-iconfield>
        </div>
      </div>
    }

    <div class="log-panel-wrap">
      <chaotic-xterm-log
        #term
        [chunk]="logChunks()"
        [scrollToLine]="scrollToLine()"
        (lineClick)="onLineClick($event)"
      />
    </div>
  </div>
</div>
