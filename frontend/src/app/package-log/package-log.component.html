<chaotic-title [subtitle]="subtitle()" title="{{ pkgname() || 'Package log' }}" />

<div class="package-log">
  @if (error()) {
    <p class="log-error">{{ error() }}</p>
  }

  @if (builder() || streaming()) {
    <div class="log-toolbar">
      @if (builder(); as host) {
        <span class="builder-name">
          <i class="pi pi-server"></i>
          {{ host }}
        </span>
      }
      <div class="toolbar-right">
        @if (streaming()) {
          <span class="live-badge">● live</span>
        }
        <button
          class="download-btn"
          [class.hide-download]="searchQuery()"
          (click)="downloadLog()"
          type="button"
          aria-label="Download log"
        >
          <i class="pi pi-download"></i>
        </button>
        @if (searchQuery()) {
          <button class="search-nav" (click)="searchPrevious()" type="button" aria-label="Previous match">
            <i class="pi pi-angle-up"></i>
          </button>
          <button class="search-nav" (click)="searchNext()" type="button" aria-label="Next match">
            <i class="pi pi-angle-down"></i>
          </button>
        }
        <p-iconfield class="search-field" iconPosition="left">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            class="w-full"
            #searchInput
            [value]="searchQuery()"
            (input)="onSearch($any($event.target).value)"
            (keydown.enter)="searchNext()"
            (keydown.shift.enter)="searchPrevious()"
            pInputText
            type="text"
            placeholder="Search buffer"
          />
        </p-iconfield>
      </div>
    </div>
  }

  <div class="log-panel-wrap">
    <chaotic-xterm-log #term [chunk]="logChunks()" [scrollToLine]="scrollToLine()" (lineClick)="onLineClick($event)" />
  </div>
</div>
