<div class="mx-auto max-w-4xl">
  <h2 class="text-ctp-maroon my-5 text-center text-2xl font-bold">
    <i class="pi-info-circle pi" style="font-size: 1.25rem"></i> Latest news
  </h2>
  <div class="flex flex-col gap-4">
    @for (news of visibleNews(); track news.data.id) {
      @defer (on viewport) {
        <p-fieldset legend="{{ news.data.author }} on {{ news.data.date | date: 'short' }}">
          <div class="news-content max-w-full overflow-x-auto break-words" [innerHTML]="news.html"></div>
        </p-fieldset>
      } @placeholder {
        <p-fieldset legend="I am loading..." />
      }
    }
  </div>
  @if (hasMore()) {
    <div class="mt-6 text-center">
      <p-button (onClick)="showMore()" label="Show more news" icon="pi pi-angle-down" iconPos="right" text />
    </div>
  }
</div>
