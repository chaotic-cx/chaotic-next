<div class="mx-auto max-w-4xl">
  <h2 class="text-ctp-maroon my-5 text-center text-2xl font-bold">
    <i class="pi pi-globe" style="font-size: 1.25rem"></i> Mirror map
  </h2>
  <div class="flex flex-col gap-4">
    <p-panel>
      <p class="text-ctp-text mb-5">
        This map shows our current mirrors and which one will be used if our geo-mirror is used. The one right in the
        middle of the map is our CDN mirror, which is hosted in Cloudflare R2 and therefore globally available.
        <a class="text-ctp-mauve" href="https://status.chaotic.cx/map" rel="noopener" target="_blank"
          >There is also a 3D globe view!</a
        >
      </p>
      <om-map
        class="mt-5 rounded-3xl"
        [dots]="dots()"
        [lineColor]="lineColor"
        [mapColor]="mapColor"
        [mapDotsRadius]="0.2"
        [precomputedMap]="precomputedMap"
        mapDotsShape="hexagon"
      />
    </p-panel>
  </div>
</div>
