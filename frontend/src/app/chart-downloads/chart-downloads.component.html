<div class="card relative flex h-full min-h-[24rem] justify-center">
  @if (hasData()) {
    <p-chart
      class="w-full h-full"
      [data]="chartConfig().data"
      [options]="chartConfig().options"
      [responsive]="true"
      type="bar"
    />
  } @else if (loading()) {
    <div class="absolute inset-0 flex items-center justify-center">
      <i class="pi pi-spin pi-spinner text-ctp-flamingo" style="font-size: 3rem"></i>
    </div>
  }
</div>
<p-input-number
  [(ngModel)]="range"
  [showButtons]="true"
  [min]="1"
  [max]="200"
  mode="decimal"
  inputId="minmaxDownloads"
  placeholder="Number of packages"
/>
