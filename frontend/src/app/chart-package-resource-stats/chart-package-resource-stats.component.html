@if (loading()) {
  <div class="card relative flex h-[16rem] sm:h-[12rem] justify-center">
    <div class="absolute inset-0 flex items-center justify-center">
      <i class="pi pi-spin pi-spinner text-ctp-flamingo" style="font-size: 3rem"></i>
    </div>
  </div>
}
<div class="flex flex-col gap-6">
  @for (chart of charts(); track chart.key) {
    <div class="card relative flex h-[16rem] sm:h-[12rem] justify-center">
      <p-chart
        class="w-full h-full"
        [data]="chart.config.data"
        [options]="chart.config.options"
        [responsive]="true"
        type="line"
      />
    </div>
  }
</div>
