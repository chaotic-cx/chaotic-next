<div class="background flex min-h-svh flex-col">
  <garuda-shell class="flex-1 p-2" [menuItems]="items()">
    <div class="flex items-center gap-2" garudaShellBarStart>
      <a class="flex items-center" routerLink="/" aria-label="Go to the home page">
        <img ngSrc="/assets/logo_28.png" width="28" height="28" priority alt="logo" />
      </a>
      <p-button
        class="mobile-nav-trigger"
        [icon]="mobileNavOpen() ? 'pi pi-times' : 'pi pi-bars'"
        [ariaLabel]="mobileNavOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        (onClick)="mobileNavOpen.update((open) => !open)"
        size="small"
        text
        rounded
      />
    </div>
    <div class="router-container">
      <router-outlet #routerOutlet="outlet" />
    </div>
    <div class="flex items-center gap-2" garudaShellBarEnd>
      <div class="flex h-[15px] w-[15px] items-center justify-center">
        @if (loadingService.isLoading()) {
          <p-progress-spinner [style]="{ width: '15px', height: '15px' }" ariaLabel="loading" strokeWidth="5" />
        }
      </div>
      <chaotic-auth-button />
    </div>
  </garuda-shell>
  <chaotic-footer />

  <chaotic-mobile-nav [items]="items()" [visible]="mobileNavOpen()" (closed)="mobileNavOpen.set(false)" />
</div>

<p-confirm-dialog [appendTo]="'body'" acceptButtonStyleClass="p-button-sm" rejectButtonStyleClass="p-button-sm" />
