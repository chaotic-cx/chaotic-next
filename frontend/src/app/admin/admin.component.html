<div class="chaotic-page admin-shell">
  <nav class="admin-nav" #nav (window:resize)="onNavResize()" aria-label="Admin sections">
    <p class="admin-nav__title">Admin</p>
    @if (indicator(); as box) {
      <span
        class="admin-nav__indicator"
        [style.--indicator-top.px]="box.top"
        [style.--indicator-left.px]="box.left"
        [style.--indicator-width.px]="box.width"
        [style.--indicator-height.px]="box.height"
        aria-hidden="true"
      ></span>
    }
    @for (group of groups; track group.label) {
      <div class="admin-nav__group">
        @if (group.label) {
          <p class="admin-nav__group-label">{{ group.label }}</p>
        }
        <ul class="admin-nav__list">
          @for (item of group.items; track item.path) {
            <li>
              <a
                class="admin-nav__link"
                #navLink
                [routerLink]="item.path"
                [attr.data-path]="item.path"
                routerLinkActive="is-active"
                ariaCurrentWhenActive="page"
              >
                <i [class]="item.icon" aria-hidden="true"></i>
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <main class="admin-main">
    <header class="admin-header">
      <h1 class="admin-header__title">{{ activeItem().label }}</h1>
      <p class="admin-header__desc">{{ activeItem().description }}</p>
    </header>
    <div class="admin-content">
      <router-outlet />
    </div>
  </main>
</div>
