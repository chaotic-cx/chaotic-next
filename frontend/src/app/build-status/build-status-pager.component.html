@if (pageCount() > 1) {
  <nav class="flex items-center gap-1" *transloco="let t" [attr.aria-label]="t('common.pagination')">
    <button
      class="chaotic-icon-btn"
      [disabled]="page() <= 1"
      [attr.aria-label]="t('common.previousPage')"
      (click)="goTo(page() - 1)"
      type="button"
    >
      <i class="pi pi-angle-left" aria-hidden="true"></i>
    </button>
    <span class="min-w-12 text-center text-xs tabular-nums text-ctp-subtext1">{{ page() }} / {{ pageCount() }}</span>
    <button
      class="chaotic-icon-btn"
      [disabled]="page() >= pageCount()"
      [attr.aria-label]="t('common.nextPage')"
      (click)="goTo(page() + 1)"
      type="button"
    >
      <i class="pi pi-angle-right" aria-hidden="true"></i>
    </button>
  </nav>
}
