@if (pageCount() > 1) {
  <nav class="flex items-center gap-1" aria-label="Pagination">
    <button
      class="chaotic-icon-btn"
      [disabled]="page() <= 1"
      (click)="goTo(page() - 1)"
      type="button"
      aria-label="Previous page"
    >
      <i class="pi pi-angle-left" aria-hidden="true"></i>
    </button>
    <span class="min-w-12 text-center text-xs tabular-nums text-ctp-subtext1">{{ page() }} / {{ pageCount() }}</span>
    <button
      class="chaotic-icon-btn"
      [disabled]="page() >= pageCount()"
      (click)="goTo(page() + 1)"
      type="button"
      aria-label="Next page"
    >
      <i class="pi pi-angle-right" aria-hidden="true"></i>
    </button>
  </nav>
}
