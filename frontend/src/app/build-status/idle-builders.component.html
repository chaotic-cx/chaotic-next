@if (buildStatusService.idleQueue().length > 0) {
  <section class="flex flex-col">
    <chaotic-build-status-section
      title="Idle builders"
      subtitle="Currently idle builders"
      icon="pi-list"
      iconClass="text-ctp-peach"
    />
    <ul class="max-h-[32rem] divide-y divide-white/5 overflow-y-auto pr-1" animate.enter="content-fade" chaoticFlipList>
      @for (pkg of buildStatusService.idleQueue(); track pkg.rawName; let index = $index) {
        <li
          class="flex items-center justify-between gap-3 py-2.5"
          [style.--stagger]="index"
          animate.enter="pipeline-item-enter"
        >
          <span class="min-w-0 truncate font-medium">{{ pkg.name }}</span>
          <span class="shrink-0 text-sm text-ctp-subtext1">{{ pkg.build_class | buildClass }}</span>
        </li>
      }
    </ul>
  </section>
} @else {
  <section class="flex flex-col">
    <chaotic-build-status-section
      title="Idle builders"
      subtitle="Currently idle builders"
      icon="pi-list"
      iconClass="text-ctp-subtext0"
    />
    <div class="flex flex-1 flex-col items-center justify-center gap-2 py-8 text-center text-ctp-subtext0">
      <i class="pi pi-server text-3xl"></i>
      <span class="text-sm font-medium">No idle builders</span>
    </div>
  </section>
}
