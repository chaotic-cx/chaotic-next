@if (buildStatusService.idleQueue().length > 0) {
  <section class="flex h-full flex-col" animate.enter="queue-section-enter" animate.leave="queue-section-leave">
    <chaotic-build-status-section
      title="Idle builders"
      subtitle="Currently idle builders"
      icon="pi-list"
      iconClass="text-ctp-peach"
    />
    <ul class="flex-1 max-h-[26rem] divide-y divide-white/5 overflow-y-auto pr-1">
      @for (pkg of buildStatusService.idleQueue(); track pkg.name) {
        <li
          class="flex items-center justify-between gap-3 py-2.5"
          animate.enter="queue-item-enter"
          animate.leave="queue-item-leave"
        >
          <span class="min-w-0 truncate font-medium">{{ pkg.name }}</span>
          <span class="shrink-0 text-sm text-ctp-subtext1">{{ pkg.build_class | buildClass }}</span>
        </li>
      }
    </ul>
  </section>
}
