<section class="flex min-h-0 flex-1 flex-col">
  <chaotic-build-status-section
    title="Latest deployments"
    subtitle="Most recently built packages"
    icon="pi-server"
    iconClass="text-ctp-green"
  />
  @if (!buildStatusService.loadingDeployments()) {
    <ul
      class="min-h-0 flex-1 divide-y divide-white/5 overflow-y-auto pr-1"
      animate.enter="content-fade"
      chaoticFlipList
    >
      @for (deployment of paginatedDeployments(); track deployment.id; let index = $index) {
        <li
          class="flex items-center justify-between gap-3 py-2.5"
          [style.--stagger]="index"
          animate.enter="pipeline-item-enter"
        >
          <div class="min-w-0 flex-1">
            <span class="block wrap-break-word font-medium">{{ deployment.pkgbase.pkgname }}</span>
            @if (deployment.repo?.name; as repoName) {
              <span class="block text-sm text-ctp-subtext1">{{ repoName }}</span>
            }
          </div>
          <div class="flex shrink-0 items-center gap-3">
            <span
              class="whitespace-nowrap text-xs text-ctp-subtext1"
              [pTooltip]="(deployment.timestamp | localeDate) ?? undefined"
              tooltipPosition="top"
              >{{ deployment.timestamp | relativeTime }}</span
            >
            <a
              class="cursor-pointer text-ctp-mauve hover:text-ctp-text"
              [routerLink]="packageLogRouteFromUrl(deployment.logUrl ?? '')"
              pTooltip="Open build log"
              tooltipPosition="left"
              aria-label="Open build log for {{ deployment.pkgbase.pkgname }}"
            >
              <i class="pi pi-bars"></i>
            </a>
          </div>
        </li>
      }
    </ul>
  }

  <chaotic-build-status-pager
    class="mt-4 shrink-0"
    [page]="currentPage()"
    [pageCount]="pageCount()"
    (pageChange)="selectPage($event)"
  />
</section>
