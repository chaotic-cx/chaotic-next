<chaotic-title title="Build status" subtitleHtml="Currently running pipelines and build queue." />

<div class="chaotic-container-wide-center md:chaotic-container-regular px-0.5 sm:px-2.5">
  <p-card>
    <div class="flex flex-col gap-16 text-left">
      @if (buildStatusService.loadingQueue()) {
        <p-skeleton width="100%" height="10rem" />
      }

      <div class="grid grid-cols-1 gap-16 lg:grid-cols-2">
        <div class="flex flex-col justify-between gap-16">
          <chaotic-build-status-active-builds />
          <chaotic-build-status-waiting-builds />
          <chaotic-build-status-idle-builders />
        </div>
        <div class="flex flex-col justify-between gap-16">
          <chaotic-build-status-pipelines (openPipeline)="showDialog($event)" />
          <chaotic-build-status-deployments />
        </div>
      </div>
    </div>
  </p-card>
</div>

<chaotic-build-status-pipeline-dialog [(visible)]="dialogVisible" [data]="dialogData()" />
