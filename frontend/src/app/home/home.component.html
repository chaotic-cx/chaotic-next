<div class="h-svh">
  <div class="surface-section mt-5 px-4 py-8 md:mt-10 md:px-6 lg:px-8">
    <div class="text-center">
      <a
        class="mx-auto block cursor-pointer"
        [style.width]="isWide() ? '360px' : '80%'"
        href="https://aur.chaotic.cx/aizawa/index.html"
        aria-label="Open the interactive Chaotic-AUR applet"
      >
        <img class="w-full" priority ngSrc="/assets/logo.svg" alt="Chaotic-AUR logo" width="741" height="711" />
      </a>
      <h1 class="text-ctp-maroon mb-10 mt-20 text-3xl font-bold">Chaotic-AUR</h1>
      <p class="text-ctp-mauve my-10 text-2xl font-bold">Automated building repo for AUR packages 👨🏻‍💻</p>
      <p class="text-ctp-text my-5 text-xl">Building AUR packages for you, so you don't have to!</p>
      <div>
        <p-button
          class="whitespace-nowrap my-5 px-5 py-3 font-bold"
          label="Start right away"
          iconPos="right"
          icon="pi pi-sparkles"
          routerLink="docs"
          rounded
          pTooltip="Get started with Chaotic-AUR documentation"
          tooltipPosition="bottom"
        />
        <span
          class="hero-scroll-hint mt-20 block font-bold text-primary pi pi-arrow-down cursor-pointer"
          (click)="scrollToNews(newsSection)"
          (keydown.enter)="scrollToNews(newsSection)"
          style="font-size: 3rem"
          tabindex="0"
          role="button"
          aria-label="Scroll to newsfeed"
        ></span>
      </div>
    </div>
  </div>
</div>

<div class="mx-auto mb-10 mt-20" #newsSection>
  <chaotic-newsfeed />
</div>
<div class="mx-auto mb-10 mt-20">
  <chaotic-mirror-map />
</div>
