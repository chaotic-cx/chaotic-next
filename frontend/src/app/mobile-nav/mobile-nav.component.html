@if (visible()) {
  <div class="mobile-nav" id="mobile-nav" *transloco="let t; prefix: 'mobileNav'">
    <nav class="mobile-nav__links" [attr.aria-label]="t('ariaLabel')">
      @for (item of items(); track item.label) {
        <a class="mobile-nav__link" [routerLink]="item.routerLink" (click)="closed.emit()">
          <i [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="mobile-nav__auth">
      <chaotic-auth-button class="in-drawer" />
    </div>
  </div>
}
