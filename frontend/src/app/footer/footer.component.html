<footer class="chaotic-footer" *transloco="let t; prefix: 'footer'">
  <p-card>
    <nav
      class="flex flex-wrap items-center justify-center gap-x-5 gap-y-1 text-center"
      [attr.aria-label]="t('ariaLabel')"
    >
      <a class="chaotic-footer__link text-ctp-mauve" href="https://aur.chaotic.cx" rel="noopener" target="_blank"
        >Chaotic-AUR &copy; {{ currentYear }}<span class="sr-only"> {{ t('opensInNewTab') }}</span></a
      >
      <a
        class="chaotic-footer__link text-ctp-mauve"
        href="https://gitlab.com/chaotic-aur"
        rel="noopener"
        target="_blank"
      >
        <!-- Simple Icons GitLab mark (CC0); the icon set has none. -->
        <svg class="chaotic-footer__icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="m23.6004 9.5927-.0337-.0862L20.3.9814a.851.851 0 0 0-.3362-.405.8748.8748 0 0 0-.9997.0539.8748.8748 0 0 0-.29.4399l-2.2055 6.748H7.5375l-2.2057-6.748a.8573.8573 0 0 0-.29-.4412.8748.8748 0 0 0-.9997-.0537.8585.8585 0 0 0-.3362.4049L.4332 9.5015l-.0325.0862a6.0657 6.0657 0 0 0 2.0119 7.0105l.0113.0087.03.0213 4.976 3.7264 2.462 1.8633 1.4995 1.1321a1.0085 1.0085 0 0 0 1.2197 0l1.4995-1.1321 2.4619-1.8633 5.006-3.7489.0125-.01a6.0682 6.0682 0 0 0 2.0094-7.003z"
          />
        </svg>
        GitLab<span class="sr-only"> {{ t('opensInNewTab') }}</span>
      </a>
      <a
        class="chaotic-footer__link text-ctp-mauve"
        href="https://github.com/chaotic-aur"
        rel="noopener"
        target="_blank"
      >
        <i class="chaotic-footer__icon pi pi-github" aria-hidden="true"></i>
        GitHub<span class="sr-only"> {{ t('opensInNewTab') }}</span>
      </a>
      <a class="chaotic-footer__link text-ctp-mauve" routerLink="/code-of-conduct">
        <i class="chaotic-footer__icon pi pi-users" aria-hidden="true"></i>
        {{ t('codeOfConduct') }}
      </a>
      <a class="chaotic-footer__link text-ctp-mauve" routerLink="/privacy">
        <i class="chaotic-footer__icon pi pi-shield" aria-hidden="true"></i>
        {{ t('privacy') }}
      </a>
      @if (version()) {
        <a
          class="chaotic-footer__link text-ctp-overlay1"
          [href]="`https://github.com/chaotic-cx/chaotic-next/releases/tag/${version()}`"
          rel="noopener"
          target="_blank"
        >
          <i class="chaotic-footer__icon pi pi-tag" aria-hidden="true"></i>
          {{ version() }}<span class="sr-only"> {{ t('opensInNewTab') }}</span>
        </a>
      }
    </nav>
  </p-card>
</footer>
