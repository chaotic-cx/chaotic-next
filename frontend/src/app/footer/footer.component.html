<footer class="chaotic-footer" *transloco="let t; prefix: 'footer'">
  <p-card>
    <nav
      class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-center"
      [attr.aria-label]="t('ariaLabel')"
    >
      <a class="text-ctp-mauve" href="https://aur.chaotic.cx" rel="noopener" target="_blank"
        >Chaotic-AUR &copy; {{ currentYear }}<span class="sr-only"> {{ t('opensInNewTab') }}</span></a
      >
      <a class="text-ctp-mauve" href="https://gitlab.com/chaotic-aur" rel="noopener" target="_blank"
        >GitLab<span class="sr-only"> {{ t('opensInNewTab') }}</span></a
      >
      <a class="text-ctp-mauve" href="https://github.com/chaotic-aur" rel="noopener" target="_blank"
        >GitHub<span class="sr-only"> {{ t('opensInNewTab') }}</span></a
      >
      <a class="text-ctp-mauve" routerLink="/code-of-conduct">{{ t('codeOfConduct') }}</a>
      <a class="text-ctp-mauve" routerLink="/privacy">{{ t('privacy') }}</a>
      @if (version()) {
        <a
          class="text-ctp-overlay1"
          [href]="`https://github.com/chaotic-cx/chaotic-next/releases/tag/${version()}`"
          rel="noopener"
          target="_blank"
          >{{ version() }}<span class="sr-only"> {{ t('opensInNewTab') }}</span></a
        >
      }
    </nav>
  </p-card>
</footer>
